name: Release Driver Plugins

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: "0.17.1"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-release:
    needs: ci
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            lib_ext: so
          - os: macos-15
            asset_suffix: macos-aarch64
            lib_ext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ vars.ZIG_VERSION || env.ZIG_VERSION }}

      - name: Install SQLite dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build release artifacts
        working-directory: driver
        run: |
          zig build -Doptimize=ReleaseSafe
          mkdir -p dist
          for f in zig-out/lib/libdriver_*.${{ matrix.lib_ext }}; do
            base=$(basename "$f" .${{ matrix.lib_ext }})
            cp "$f" "dist/${base}-${{ matrix.asset_suffix }}.${{ matrix.lib_ext }}"
          done

      - name: Publish assets to driver Releases
        uses: softprops/action-gh-release@v2
        with:
          files: driver/dist/*
