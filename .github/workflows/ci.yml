name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  ZIG_VERSION: "0.17.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Checkout parabellum-kernel/lib
        uses: actions/checkout@v4
        with:
          repository: parabellum-kernel/lib
          path: lib
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ vars.ZIG_VERSION || env.ZIG_VERSION }}

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build & Test
        working-directory: driver
        run: |
          zig build
          zig build test
