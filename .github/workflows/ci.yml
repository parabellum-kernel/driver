name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: driver

      - name: Checkout sibling sdk
        uses: actions/checkout@v4
        with:
          repository: parabellum-kernel/sdk
          path: sdk

      - name: Checkout sibling lib
        uses: actions/checkout@v4
        with:
          repository: parabellum-kernel/lib
          path: lib

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build & Test
        working-directory: driver
        run: |
          zig build
          zig build test
